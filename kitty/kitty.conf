# font_family FiraCode Nerd Font
font_size 12.0



# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# Disable the bell sound (e.g. backspace on empty prompt)
enable_audio_bell no
