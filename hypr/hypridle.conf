# Power-aware idle.
# When a timeout is reached, hypridle runs condition_cmd: exit 0 runs on-timeout,
# anything else blocks it and re-checks every condition_retry seconds while
# still idle. So plugging/unplugging mid-idle is picked up without a restart.
# AC0/online is 1 when plugged in, 0 on battery.
# Timeouts are written in minutes: {{N * $min}}.

$min = 60
$on_battery = grep -q 0 /sys/class/power_supply/AC0/online
$on_ac = grep -q 1 /sys/class/power_supply/AC0/online
$retry = 30

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# ---- On battery ----

listener {
    timeout = {{30 * $min}}
    condition_cmd = $on_battery
    condition_retry = $retry
    on-timeout = loginctl lock-session
}

listener {
    timeout = {{40 * $min}}
    condition_cmd = $on_battery
    condition_retry = $retry
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = {{60 * $min}}
    condition_cmd = $on_battery
    condition_retry = $retry
    on-timeout = systemctl suspend
}

# ---- On AC ----

listener {
    timeout = {{60 * $min}}
    condition_cmd = $on_ac
    condition_retry = $retry
    on-timeout = loginctl lock-session
}

listener {
    timeout = {{80 * $min}}
    condition_cmd = $on_ac
    condition_retry = $retry
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = {{120 * $min}}
    condition_cmd = $on_ac
    condition_retry = $retry
    on-timeout = systemctl suspend
}
