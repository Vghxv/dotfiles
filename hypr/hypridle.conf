general {
    lock_cmd = pidof hyprlock || hyprlock       # don't start a second hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend / lid close
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'                   # screen back on after wake
}

listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                               # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800                              # 30 min
    on-timeout = systemctl suspend
}
